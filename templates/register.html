{% extends 'base.html' %}
{% load static  %}
{% block content %}

<style>
    ::placeholder{
        color: black !important;
    }
    .form-control{
        height: 60px;
        width:550px;
        border:2px solid rgb(147, 147, 195);
        background: white;
        margin-bottom: 3%;
        border-radius:30px;
        margin-top:10px;
        box-shadow:0px 4px 15px 2px rgba(0, 0, 0, 0.2);
     
     
    }
    .k{
        padding-left:380px;
    }
    

</style>
<div class="row heading my-3">
    <div class="text-center fs-3">Sign <b class="text-mycolor1">Up <i class="fa-solid fa-user "></i></b>
    <hr class="w-25 mx-auto ">
   <b class="fs-5 text-danger"> Register now and start your learning journey with us! </b> <br> <br> 
  
   <div class="row">
  
   <div class="col-sm-10 mx-auto k">

         <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <input type="name" required placeholder="Name.." class="form-control " name="name">
                    <input type="email" required placeholder="Email.." class="form-control" name="email">
                    <input type="tel" required placeholder="Mobile.." class="form-control" name="mob" maxlength="10" pattern="[0-9]{10}">
                    <input type="password" required placeholder="Password.." class="form-control" name="passwd" maxlength="10">
                    <input type="file" class="form-control" name="fu" accept="image/*" required>
                    
                <textarea name="address" class="form-control " placeholder="Address" style="min-height: 80px;"></textarea>
                <input type="submit" value="Register now" class="form-control text-light" style="background:#01579B !important;">
                </form>
          </div>  
   </div>
   </div>
    </div>
</div>
<!------------heading end-->

 

{% endblock %}
